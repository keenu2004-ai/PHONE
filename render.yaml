services:
  # TeamNest Unified Full-Stack Application (Frontend UI + Backend API)
  - type: web
    name: teamnest-app
    env: node
    region: oregon
    plan: starter
    rootDir: .
    buildCommand: npm --prefix client install && npm --prefix client run build && npm --prefix server install && npm --prefix server run db:push && npm --prefix server run build
    startCommand: npm --prefix server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: teamnest-postgres
          property: connectionString

databases:
  # Managed PostgreSQL Database
  - name: teamnest-postgres
    region: oregon
    plan: starter
    databaseName: teamnest_db
    user: teamnest_user
